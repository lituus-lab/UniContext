# Dependency directions checked by `nimble checkVGraph`.

# A module may import its own layer and any layer above it, never below.
# `domain` holds the types every other layer speaks in; `protocol` sits at the
# top because the MCP surface composes all of them.
[layers]
domain
workspace
text
database
context
memory
index
protocol
c_api
cli

[engines]
UniDatabase

# SQLite reaches the engine through one adapter, so swapping the store for
# another UniDatabase backend touches one file.
[confined]
UniDatabase = src/UniContext/database/store.nim
