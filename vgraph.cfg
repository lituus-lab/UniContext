# Dependency directions checked by `nimble checkVGraph`.

# A module may import its own layer and any layer above it, never below.
# `domain` holds the types every other layer speaks in; `protocol` sits at the
# top because the MCP surface composes all of them.
[layers]
domain
workspace
text
database
context
memory
index
protocol
c_api
cli

[engines]
UniDatabase
UniMCP

# Each sibling engine reaches UniContext through exactly one module, so
# swapping the store for another UniDatabase backend, or the transport for
# another MCP surface, touches one file.
[confined]
UniDatabase = src/UniContext/database/store.nim
UniMCP = src/UniContext/protocol/mcp_server.nim
