[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0", "Cython==3.2.8"]
build-backend = "setuptools.build_meta"

[project]
name = "lituus-unicontext"
version = "1.0.0"
description = "Python binding for sourced context packets over a knowledge base"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "lituus-lab" }]
keywords = ["context", "knowledge-base", "markdown", "mcp", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.0"]

[tool.setuptools]
packages = ["unicontext"]
